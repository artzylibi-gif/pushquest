<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PushQuest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PushQuest">
<style>
:root{--bg:#0b0d1a;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.11);--line:rgba(255,255,255,.11);--tx:#f6f4ff;--mut:#a3a8c9;--acc:#ff7a2f;--acc2:#ff3d6e;--cy:#4fd8ff;--hp:#ff4560;--ok:#36e08a;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b0d1a}
body{margin:0;min-height:100vh;color:var(--tx);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1200px 700px at 12% -10%,#2b1f5e 0%,transparent 60%),radial-gradient(900px 600px at 100% 8%,#4a1637 0%,transparent 55%),#0b0d1a;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:1180px;margin:0 auto;width:100%;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font-weight:900;letter-spacing:.16em;font-size:16px;background:linear-gradient(90deg,#ffc27a,#ff3d6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:900;font-size:15px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:28px;background:rgba(20,24,54,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);z-index:5;width:min(580px,calc(100% - 24px));box-shadow:0 10px 40px rgba(0,0,0,.5)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-weight:800;font-size:12px;font-family:inherit;padding:8px 4px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 20px rgba(255,61,110,.4)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.lbl{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.boss{text-align:center;position:relative;overflow:hidden}
.boss::before{content:"";position:absolute;left:50%;top:-40px;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,90,60,.38),transparent 65%)}
.bossart{position:relative;font-size:clamp(96px,15vw,150px);line-height:1.15;display:inline-block;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
@keyframes flt{50%{transform:translateY(-8px)}}
.bossart.hit{animation:none;transform:scale(.86) rotate(-8deg)}
.bn{position:relative;font-size:26px;font-weight:900}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--mut);background:var(--panel2);padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.bar{height:20px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff4560,#ff9a3d);transition:width .15s;box-shadow:0 0 14px rgba(255,69,96,.6)}
.bar.bat>i{background:linear-gradient(90deg,#27c6ff,#7affc8);box-shadow:0 0 14px rgba(79,216,255,.5)}
.btn{border:0;border-radius:22px;padding:20px;font-weight:900;font-size:22px;font-family:inherit;color:#fff;width:100%;margin-top:4px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 30px rgba(255,61,110,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .08s}
.btn.alt{background:var(--panel2);box-shadow:none;border:1px solid var(--line);font-size:15px;padding:14px;font-weight:800}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.note{color:var(--mut);font-size:13px;text-align:center;margin:12px 4px}
.bgrid{display:block}
@media (min-width:860px){.bgrid{display:grid;grid-template-columns:minmax(320px,.8fr) 1.2fr;gap:18px;align-items:start}.colR{position:sticky;top:12px}}
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px}
.up{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.up.lock{opacity:.45}
.up .ic{font-size:30px;width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--panel2)}
.up .tx{flex:1;min-width:0}.up b{display:block;font-size:17px}.up .d{color:var(--mut);font-size:13px}
.lv{font-size:11px;font-weight:900;background:var(--panel2);padding:2px 8px;border-radius:999px;margin-left:8px;color:var(--cy);vertical-align:middle}
.up button{border:0;border-radius:16px;padding:12px 14px;font-weight:900;font-size:15px;font-family:inherit;color:#04121a;background:linear-gradient(135deg,#7affc8,#4fd8ff);min-width:104px;box-shadow:0 6px 18px rgba(79,216,255,.3)}
.up button:disabled{opacity:.4;box-shadow:none;background:var(--panel2);color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}.tile b{font-size:30px;display:block;margin-top:4px}.tile span{color:var(--mut);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.chart{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:12px}.chart .col{flex:1;border-radius:6px;background:linear-gradient(180deg,#ffc27a,#ff3d6e)}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:34px;color:#ffc27a;text-shadow:0 2px 10px rgba(0,0,0,.7);animation:fl .8s ease-out forwards;z-index:40}
@keyframes fl{to{transform:translateY(-80px);opacity:0}}
.cam{display:none}.cam.on{display:block}
.cwrap{position:relative;aspect-ratio:var(--ar,4/3);width:100%;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line);margin-bottom:6px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;background:#000}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.seg{gap:6px;margin-top:6px}.seg .btn{margin:0;padding:11px 6px;font-size:14px}
.hud{display:none}
.cam.full{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;margin:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px));background:#05060d;overflow:auto;flex-direction:column;align-items:center}
.cam.full.on{display:flex}
.cam.full .hud{display:block;width:100%;max-width:760px}
.cam.full .cwrap{width:min(100%,calc((100vh - 230px)*var(--arn,1.333)))}
.cam.full>*{max-width:760px;width:100%}
.cam.full .noFull{display:none}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center;margin:0;background:#1a1f45}
#err{position:fixed;top:0;left:0;right:0;background:#c0182b;color:#fff;font:12px monospace;padding:6px;z-index:99;display:none}
@media (prefers-reduced-motion:reduce){.pop,.bossart{animation:none;transition:none}}
</style>
</head>
<body>
<div id="err"></div>
<div id="app">
<header><div class="logo">PUSHQUEST</div><div class="chips"><div class="chip">💪 <span id="hReps">0</span></div><div class="chip">💎 <span id="hCry">0</span></div></div></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<div class="modal" id="modal"><div class="card"><div id="mBody"></div><button class="btn" id="mOk">Continue</button></div></div>
<script>
"use strict";
window.onerror=function(m,u,l){var e=document.getElementById("err");if(e){e.style.display="block";e.textContent="Error: "+m+" (line "+l+")"}};
var BOSSES=[["Gloopy","🟢"],["Shellback","🐢"],["Batwing","🦇"],["Mossgrub","🐛"],["Sandclaw","🦂"],["Frostfang","🐺"],["Embertail","🦎"],["Stonehorn","🦏"],["Tidal Maw","🦈"],["Skyrender","🦅"],["Voidmoth","🦋"],["Crown Wyrm","🐉"]];
var SWORDS=["Wooden Stick","Iron Blade","Hero's Edge","Steel Fang","Moon Saber","Storm Cutter","Crystal Brand","Ember Reaper","Void Slicer","Star Splitter","Dawn Breaker","Worldender"];
var HELP=[["Squire",1,25],["Archer",8,300],["Mage",60,4000],["Golem",500,60000],["Dragon",4000,1e6]];
var SAVE="pushquest.v1";
var S=null;
function fresh(m){return{reps:0,cry:0,boss:0,hp:30,sw:0,hl:[0,0,0,0,0],mine:0,bat:0,batLv:0,cas:0,ngp:m||0,last:Date.now(),days:{},total:0,sound:true,done:false,cal:5,diff:1,view:0}}
function load(){try{var r=localStorage.getItem(SAVE);if(r){S=Object.assign(fresh(),JSON.parse(r));return}}catch(e){}S=fresh()}
function save(){S.last=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function bossHp(n){return 30*Math.pow(10,n)}
function fmt(n){if(!isFinite(n))return"∞";if(n<1000)return n<10?(Math.round(n*10)/10)+"":Math.floor(n)+"";var u=["K","M","B","T","Qa","Qi"],i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]}
function mult(){return(1+0.25*S.cas)*(1+S.ngp)}
function dpr(){return(1+S.sw)*Math.pow(2,Math.floor(S.sw/10))*mult()}
function hdps(){var t=0;for(var i=0;i<5;i++){var l=S.hl[i];t+=HELP[i][1]*l*Math.pow(2,Math.floor(l/25))}return t*mult()}
function mps(){return 0.6*S.mine*Math.pow(2,Math.floor(S.mine/10))*mult()}
function batCap(){return 60*(1+0.5*S.batLv)}
function perRep(){return 5+S.batLv}
function cost(kind,i){var l;if(kind=="sw")return 10*Math.pow(1.22,S.sw);if(kind=="hl")return HELP[i][2]*Math.pow(1.15,S.hl[i]);if(kind=="mine")return 20*Math.pow(1.18,S.mine);if(kind=="bat")return 30*Math.pow(1.3,S.batLv);return 100*Math.pow(1.6,S.cas)}
function reward(n){return 40*Math.pow(3.2,n)}
function dealDamage(d){
  var guard=0;
  while(d>0&&!S.done&&guard++<50){
    if(d>=S.hp){d-=S.hp;S.cry+=reward(S.boss);
      if(S.boss>=11){S.done=true;S.hp=0;showVictory();break}
      S.boss++;S.hp=bossHp(S.boss);S.flash="Defeated "+BOSSES[S.boss-1][0]+"!"
    }else{S.hp-=d;d=0}
  }
}
function addRep(){
  if(S.done)return;
  var d=dpr();S.reps++;S.total++;S.cry+=Math.max(1,d*0.2);
  S.bat=Math.min(batCap(),S.bat+perRep());
  var k=new Date().toISOString().slice(0,10);S.days[k]=(S.days[k]||0)+1;
  dealDamage(d);beep();pop("-"+fmt(d));
  var a=document.getElementById("art");if(a){a.classList.add("hit");setTimeout(function(){a.classList.remove("hit")},90)}
  render(true)
}
var ac=null;
function beep(){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=520;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}catch(e){}try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function pop(t){var e=document.createElement("div");e.className="pop";e.textContent=t;e.style.left=(30+Math.random()*40)+"vw";e.style.top="38vh";document.body.appendChild(e);setTimeout(function(){e.remove()},800)}
function tick(dt){
  if(S.bat>0&&!S.done){var u=Math.min(dt,S.bat);S.bat-=u;S.cry+=mps()*u;dealDamage(hdps()*u)}
}
function modal(html,cb){document.getElementById("mBody").innerHTML=html;var m=document.getElementById("modal");m.classList.add("on");document.getElementById("mOk").onclick=function(){m.classList.remove("on");cb&&cb()}}
function showVictory(){modal("<h2>🏆 All 12 bosses defeated!</h2><p>Total push-ups: "+fmt(S.total)+"</p><p>Start New Game+ for a permanent x"+(S.ngp+2)+" damage bonus.</p>",function(){var n=S.ngp+1,t=S.total,d=S.days,s=S.sound;S=fresh(n);S.total=t;S.days=d;S.sound=s;save();render()})}
function offline(){
  var away=(Date.now()-S.last)/1000;if(away<20||S.bat<=0)return;
  var c0=S.cry,b0=S.boss,use=Math.min(away,S.bat);
  tick(use);
  modal("<h2>While you were away</h2><p>"+Math.round(away/60)+" min away, helpers worked for "+Math.round(use)+" s of battery.</p><p>+"+fmt(S.cry-c0)+" crystals"+(S.boss>b0?"<br>Bosses defeated: "+(S.boss-b0):"")+"</p>")
}
var tab="battle",cam=null;
var TABS=[["battle","Battle","⚔️"],["up","Upgrades","⬆️"],["bosses","Bosses","👑"],["stats","Stats","📊"]];var focusOn=false;
function render(light){
  document.getElementById("hReps").textContent=fmt(S.reps);document.getElementById("hCry").textContent=fmt(S.cry);
  if(light&&tab=="battle"&&document.getElementById("hpb")){updBattle();return}
  var n=document.getElementById("nav");n.innerHTML="";
  TABS.forEach(function(t){var b=document.createElement("button");b.innerHTML="<span>"+t[2]+"</span>"+t[1];if(t[0]==tab)b.className="on";b.onclick=function(){tab=t[0];render()};n.appendChild(b)});
  var m=document.getElementById("main");
  if(tab=="battle")m.innerHTML=battleHTML();else if(tab=="up")m.innerHTML=upHTML();else if(tab=="bosses")m.innerHTML=bossesHTML();else m.innerHTML=statsHTML();
  if(tab=="battle")bindBattle();
}
function battleHTML(){
  var b=BOSSES[Math.min(S.boss,11)];
  return '<div class="bgrid"><div class="colL">'+
  '<div class="card boss"><div class="bossart" id="art">'+b[1]+'</div><div class="bn">'+b[0]+'<span class="tag">Boss '+(S.boss+1)+' / 12</span></div><div class="bar"><i id="hpb"></i></div><div class="row"><b id="hpt"></b><b id="rw" style="color:var(--cy)"></b></div></div>'+
  '<div class="card"><div class="row"><span class="lbl">⚡ Battery</span><b id="bt"></b></div><div class="bar bat"><i id="bb"></i></div><div class="row" style="color:var(--mut);font-size:13px;gap:6px;flex-wrap:wrap"><span id="dp"></span><span id="ds"></span></div></div>'+
  '<button class="btn" id="rep">💪 Push-up +1</button>'+
  '<p class="note">Tap the button for each push-up, or turn on the camera and let it count. Warm up first and stop if anything hurts.</p></div>'+
  '<div class="colR"><button class="btn alt" id="camBtn">📷 Use camera to count reps</button>'+
  '<div class="card cam" id="camCard" style="margin-top:12px"><div class="hud"><div class="row"><b id="hudn"></b><b id="hudr" style="color:var(--cy)"></b></div><div class="bar"><i id="hudb"></i></div></div>'+
  '<div class="cwrap"><video id="vid" playsinline muted></video><canvas id="ov" width="320" height="240"></canvas></div>'+
  '<div class="bar bat"><i id="sig"></i></div><div class="row"><b id="cst" style="font-size:15px">Starting camera…</b><b id="cc" style="color:var(--cy)"></b></div>'+
  '<div class="row seg"><button class="btn alt" id="focusBtn">⤢ Focus mode</button><button class="btn alt noFull" id="calBtn">↻ Recalibrate</button></div>'+
  '<div class="noFull"><div class="lbl" style="margin-top:14px">Difficulty · how deep you go</div><div class="row seg" id="dif"><button class="btn alt" data-d="0">Easy</button><button class="btn alt" data-d="1">Medium</button><button class="btn alt" data-d="2">Hard</button></div>'+
  '<div class="lbl" style="margin-top:14px">Where is the iPad?</div><div class="row seg" id="vw"><button class="btn alt" data-v="0">Side-on · body tracking</button><button class="btn alt" data-v="1">Close / under me</button></div>'+
  '<div style="color:var(--mut);font-size:12px;margin-top:10px">Red dots and lines show your body. Easy needs a small elbow bend, Hard a deep one.</div></div></div></div></div>'
}
function updBattle(){
  var q=function(i){return document.getElementById(i)};
  q("hpb").style.width=(S.done?0:Math.max(0,S.hp/bossHp(S.boss)*100))+"%";
  q("hpt").textContent=fmt(Math.max(0,S.hp))+" / "+fmt(bossHp(S.boss))+" HP";
  q("rw").textContent="Reward "+fmt(reward(S.boss));
  q("bt").textContent=Math.ceil(S.bat)+"s / "+Math.round(batCap())+"s";
  q("bb").style.width=(S.bat/batCap()*100)+"%";
  q("dp").textContent="Per push-up: "+fmt(dpr());
  q("ds").textContent="Helpers: "+fmt(hdps())+"/s · Mine: "+fmt(mps())+"/s";
  q("rep").disabled=S.done;q("hudn").textContent=BOSSES[Math.min(S.boss,11)][0];q("hudr").textContent="Reps "+fmt(S.reps);q("hudb").style.width=(S.done?0:Math.max(0,S.hp/bossHp(S.boss)*100))+"%";
  if(S.bat<=0)q("bt").textContent="Empty - do push-ups to recharge";
}
function bindBattle(){
  updBattle();
  document.getElementById("rep").onclick=addRep;
  document.getElementById("camBtn").onclick=toggleCam;var fb=document.getElementById("focusBtn"),cd=document.getElementById("camCard");function applyFocus(){cd.classList.toggle("full",focusOn);fb.textContent=focusOn?"✕ Exit focus":"⤢ Focus mode";document.body.style.overflow=focusOn?"hidden":"";setTimeout(arSet,60)}fb.onclick=function(){focusOn=!focusOn;applyFocus()};applyFocus();
  function paintDif(){[].forEach.call(document.querySelectorAll("#dif button"),function(b){var on=+b.dataset.d==S.diff;b.style.background=on?"var(--acc)":"";b.style.color=on?"#fff":"";b.onclick=function(){S.diff=+b.dataset.d;save();paintDif()}})}paintDif();var cb=document.getElementById("calBtn");if(cb)cb.onclick=recal;function paintView(){[].forEach.call(document.querySelectorAll("#vw button"),function(b){var on=+b.dataset.v==S.view;b.style.background=on?"var(--acc)":"";b.style.color=on?"#fff":"";b.onclick=function(){S.view=+b.dataset.v;save();paintView();calStart();if(S.view==0&&cam)ensurePose()}})}paintView();
  var a=document.getElementById("art");if(a){var b=BOSSES[Math.min(S.boss,11)][1];a.textContent=b}
  if(cam)attachCam()
}
function upRow(ic,t,d,c,lv,fn){var ok=S.cry>=c;return '<div class="up"><div class="ic">'+ic+'</div><div class="tx"><b>'+t+'<span class="lv">Lv '+lv+'</span></b><span class="d">'+d+'</span></div><button '+(ok?"":"disabled")+' onclick="buy(\''+fn+'\')">'+fmt(c)+' 💎</button></div>'}
function upHTML(){
  var HI=["🛡️","🏹","🔮","🗿","🐲"];
  var h='<div class="lbl" style="margin:6px 4px 10px">Gear · '+SWORDS[Math.min(S.sw,11)]+'</div><div class="ugrid">'+upRow("⚔️","Sword","Damage per push-up: "+fmt(dpr()),cost("sw"),S.sw,"sw")+upRow("🏰","Castle","All damage and income +25% per level",cost("cas"),S.cas,"cas")+upRow("🔋","Battery","More capacity and more charge per push-up",cost("bat"),S.batLv,"bat")+upRow("⛏️","Mine","Crystals per second: "+fmt(mps()),cost("mine"),S.mine,"mine")+'</div>';
  h+='<div class="lbl" style="margin:18px 4px 10px">Helpers · work only while the battery has charge</div><div class="ugrid">';
  for(var i=0;i<5;i++)h+=upRow(HI[i],HELP[i][0],"+"+fmt(HELP[i][1]*mult())+" damage/s each",cost("hl",i),S.hl[i],"hl"+i);
  return h+"</div>"
}
function buy(k){
  var c;if(k.indexOf("hl")==0){var i=+k[2];c=cost("hl",i);if(S.cry<c)return;S.cry-=c;S.hl[i]++}
  else{c=cost(k);if(S.cry<c)return;S.cry-=c;if(k=="sw")S.sw++;else if(k=="cas")S.cas++;else if(k=="bat")S.batLv++;else S.mine++}
  save();render()
}
function bossesHTML(){
  var h='<div class="ugrid">';
  BOSSES.forEach(function(b,i){var st=i<S.boss||(S.done&&i==11)?"Defeated":i==S.boss?"Fighting now":"Locked";h+='<div class="up'+(st=="Locked"?" lock":"")+'"><div class="ic">'+(st=="Locked"?"❔":b[1])+'</div><div class="tx"><b>'+b[0]+'</b><span class="d">'+fmt(bossHp(i))+" HP · "+st+'</span></div></div>'});
  return h+"</div>"
}
function statsHTML(){
  var today=new Date().toISOString().slice(0,10),streak=0,d=new Date();
  while(S.days[d.toISOString().slice(0,10)]){streak++;d.setDate(d.getDate()-1)}
  var h='<div class="tiles"><div class="tile"><span>Lifetime push-ups</span><b>'+fmt(S.total)+'</b></div><div class="tile"><span>Today</span><b>'+(S.days[today]||0)+'</b></div><div class="tile"><span>Day streak</span><b>'+streak+' 🔥</b></div><div class="tile"><span>New Game+</span><b>'+S.ngp+'</b></div></div>';
  var vals=[],mx=1,dd=new Date();dd.setDate(dd.getDate()-13);
  for(var i=0;i<14;i++){var v=S.days[dd.toISOString().slice(0,10)]||0;vals.push(v);mx=Math.max(mx,v);dd.setDate(dd.getDate()+1)}
  h+='<div class="card" style="margin-top:14px"><div class="lbl">Last 14 days</div><div class="chart">';
  vals.forEach(function(v){h+='<div class="col" style="height:'+Math.max(4,v/mx*100)+'%;opacity:'+(v?1:.25)+'"></div>'});
  h+='</div></div><div class="card"><div class="row"><b>Sound</b><button class="btn alt" style="width:auto;margin:0;padding:10px 24px" onclick="S.sound=!S.sound;save();render()">'+(S.sound?"On":"Off")+'</button></div><button class="btn alt" style="margin-top:12px" onclick="if(confirm(\'Erase all progress?\')){S=fresh();save();render()}">Reset progress</button></div>';
  return h
}
/* Camera rep counter v3: silhouette vs. background with exposure compensation. Two views: side (height) or close (size). */
var CW=64,CH=48,K=5;
var cs={t:null,cv:null,ctx:null,bg:null,bgAcc:null,bgN:0,mode:"bg",t0:0,up:null,down:null,h:null,topx:0,state:"up",lastRep:0,flash:0,buf:[],warn:0,big:0};
function toggleCam(){if(cam){stopCam()}else startCam()}
function setMsg(t){var e=document.getElementById("cst");if(e)e.textContent=t}
function calStart(){cs.mode="bg";cs.t0=Date.now();cs.bgAcc=null;cs.bgN=0;cs.up=null;cs.down=null;cs.buf=[];cs.state="up";cs.h=null;cs.big=0}
function arSet(){var v=document.getElementById("vid"),w=document.querySelector(".cwrap");if(v&&w&&v.videoWidth){w.style.setProperty("--ar",v.videoWidth+"/"+v.videoHeight);w.parentNode.style.setProperty("--arn",v.videoWidth/v.videoHeight)}}
function startCam(){
  var cc=document.getElementById("camCard");cc.classList.add("on");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMsg("Camera not available here. Use the button.");return}
  var tryCam=function(c){return navigator.mediaDevices.getUserMedia(c)};
  tryCam({video:{facingMode:{exact:"user"}},audio:false}).catch(function(e){if(e&&e.name=="NotAllowedError")throw e;return tryCam({video:{facingMode:"user"},audio:false})}).catch(function(e){if(e&&e.name=="NotAllowedError")throw e;return tryCam({video:true,audio:false})}).then(function(st){
    cam=st;attachCam();try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
    cs.cv=document.createElement("canvas");cs.cv.width=CW;cs.cv.height=CH;cs.ctx=cs.cv.getContext("2d",{willReadFrequently:true});
    calStart();pose.st="up";if(S.view==0)ensurePose();clearInterval(cs.t);cs.t=setInterval(camFrame,80)
  }).catch(function(e){setMsg("Camera error: "+(e&&e.name||"unknown")+". "+(e&&e.name=="NotAllowedError"?"Camera was refused. Check Settings > Safari > Camera.":"Use the +1 button instead."))})
}
function attachCam(){var v=document.getElementById("vid");if(v&&cam&&v.srcObject!==cam){v.onloadedmetadata=arSet;v.srcObject=cam;v.play().catch(function(){})}else arSet();var cc=document.getElementById("camCard");if(cc)cc.classList.add("on");var b=document.getElementById("camBtn");if(b)b.textContent="⏹ Turn camera off"}
function stopCam(){focusOn=false;document.body.style.overflow="";clearInterval(cs.t);if(cam)cam.getTracks().forEach(function(t){t.stop()});cam=null;var cc=document.getElementById("camCard");if(cc)cc.classList.remove("on","full");var b=document.getElementById("camBtn");if(b)b.textContent="📷 Use camera to count reps"}
function median(a){var b=a.slice().sort(function(x,y){return x-y});return b[b.length>>1]}
function need(){return[0.3,0.6,0.9][S.diff]}
function drawOv(fg){
  var c=document.getElementById("ov");if(!c)return;var x=c.getContext("2d");x.clearRect(0,0,320,240);
  if(fg){x.fillStyle="rgba(255,40,60,.4)";for(var i=0;i<fg.length;i++){if(fg[i]){x.fillRect((CW-1-i%CW)*K,((i/CW)|0)*K,K,K)}}}
  if(S.view==0){
    var line=function(row,col,txt,dash){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=2;x.setLineDash(dash?[8,6]:[]);x.beginPath();x.moveTo(0,row*K);x.lineTo(320,row*K);x.stroke();x.setLineDash([]);x.font="bold 12px sans-serif";x.fillText(txt,4,Math.max(12,row*K-3))};
    if(cs.up!==null)line(cs.up,"#2fe07a","UP",1);
    if(cs.down!==null)line(cs.down,"#5ad7ff","DOWN",1);
    if(cs.mode=="run")line(cs.up+need()*(cs.down-cs.up),"#ffd02a","GO THIS LOW",0);
    if(cs.h!==null){line(cs.h,"#ff2a3c","YOU",0);x.beginPath();x.arc((CW-1-cs.topx)*K,cs.h*K,8,0,6.3);x.fill()}
  }
  if(Date.now()-cs.flash<350){x.strokeStyle="#2fe07a";x.lineWidth=10;x.strokeRect(0,0,320,240)}
}
function basicFrame(){
  var v=document.getElementById("vid");if(!v||!cam||v.readyState<2)return;
  cs.ctx.drawImage(v,0,0,CW,CH);var d=cs.ctx.getImageData(0,0,CW,CH).data,n=CW*CH,g=new Float32Array(n),i;
  for(i=0;i<n;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  var now=Date.now(),el=(now-cs.t0)/1000;
  var cc=document.getElementById("cc");if(cc)cc.textContent="Reps: "+S.reps;
  if(cs.mode=="bg"){
    setMsg("Step 1 of 3: step OUT of the picture and stay out... "+Math.max(0,Math.ceil(4-el))+"s");
    if(el>=3){if(!cs.bgAcc){cs.bgAcc=new Float32Array(n);cs.bgN=0}for(i=0;i<n;i++)cs.bgAcc[i]+=g[i];cs.bgN++}
    if(el>=4&&cs.bgN>3){cs.bg=new Float32Array(n);for(i=0;i<n;i++)cs.bg[i]=cs.bgAcc[i]/cs.bgN;cs.mode="up";cs.t0=now;cs.buf=[]}
    drawOv(null);return
  }
  /* compare to background, ignoring the whole-picture brightness shift the camera makes when you walk in */
  var df=new Float32Array(n),smp=[];
  for(i=0;i<n;i++){df[i]=g[i]-cs.bg[i];if(i%5==0)smp.push(df[i])}
  var off=median(smp),fg=new Uint8Array(n),tot=0;
  for(i=0;i<n;i++){if(Math.abs(df[i]-off)>32){fg[i]=1;tot++}else cs.bg[i]+=df[i]*.02}
  if(tot>n*.7){cs.big++;fg.fill(0);tot=0;if(cs.big>45){calStart();return}}else cs.big=0;
  var val=null;
  if(S.view==0){
    var rows=new Uint16Array(CH),top=-1;
    for(i=0;i<n-1;i++){if(fg[i]&&fg[i+1]&&(i%CW)<CW-1)rows[(i/CW)|0]++}
    if(tot>40){for(var r=0;r<CH-1;r++){if(rows[r]>=4&&rows[r+1]>=4){top=r;break}}}
    if(top>=0){var sx=0,sc=0;for(var q=0;q<CW;q++){if(fg[top*CW+q]){sx+=q;sc++}}cs.topx=sc?sx/sc:CW/2;val=top}
  }else if(tot>12)val=tot/n*100;
  if(val!==null){cs.h=cs.h===null?val:cs.h*.5+val*.5}else cs.h=null;
  var minR=S.view?4:3;
  if(cs.mode=="up"||cs.mode=="down"){
    var lab=S.view==0?(cs.mode=="up"?"Step 2 of 3: get in push-up position (arms straight) and hold":"Step 3 of 3: lower ALL the way down and hold"):(cs.mode=="up"?"Step 2 of 3: get in your start position (arms straight) and hold":"Step 3 of 3: lower ALL the way down, closest to the camera, and hold");
    if(now-cs.warn<2500)lab="Range too small, try again. ";
    if(cs.h===null){setMsg("I can't see you. Step into the picture.");cs.t0=now;cs.buf=[]}
    else{cs.buf.push(cs.h);setMsg(lab+" "+Math.max(0,Math.ceil(3-el))+"s");
      if(el>=3){var vv=median(cs.buf.slice(-12));cs.buf=[];
        if(cs.mode=="up"){cs.up=vv;cs.mode="down";cs.t0=now}
        else{cs.down=vv;if(Math.abs(cs.down-cs.up)<minR){cs.warn=now;cs.mode="up";cs.t0=now}else{cs.mode="run";cs.state="up";setMsg("Ready! Do push-ups.")}}}}
  }else if(cs.mode=="run"){
    var sg=document.getElementById("sig");
    if(cs.h!==null){
      var p=(cs.h-cs.up)/(cs.down-cs.up);
      if(sg)sg.style.width=Math.max(0,Math.min(100,p/need()*100))+"%";
      if(cs.state=="up"&&p>=need())cs.state="down";
      else if(cs.state=="down"&&p<=0.25){cs.state="up";if(now-cs.lastRep>500){cs.lastRep=now;cs.flash=now;addRep();attachCam();setMsg("Rep counted!")}}
      if(now-cs.lastRep>1200)setMsg(cs.state=="down"?"Now push back up!":(S.view==0?"Go down to the yellow line":"Go down, closer to the camera"));
    }else setMsg("I can't see you. Move into the picture.");
  }
  drawOv(fg)
}
/* Real body tracking (MediaPipe Pose). Falls back to the basic mode above if it can't load. */
var pose={pl:null,state:"none",st:"up",ang:null,lastT:-1};
function ang(a,b,c){var v1x=a.x-b.x,v1y=a.y-b.y,v2x=c.x-b.x,v2y=c.y-b.y,m=Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y);return m?Math.acos(Math.max(-1,Math.min(1,(v1x*v2x+v1y*v2y)/m)))*180/Math.PI:180}
function ensurePose(){
  if(pose.state!="none")return;pose.state="loading";setMsg("Loading body tracking (first time takes a few seconds)...");
  var base="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  import(base+"/vision_bundle.mjs").then(function(m){return m.FilesetResolver.forVisionTasks(base+"/wasm").then(function(fs){
    var mk=function(del){return m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:del},runningMode:"VIDEO",numPoses:1})};
    return mk("GPU").catch(function(){return mk("CPU")})
  })}).then(function(pl){pose.pl=pl;pose.state="ready";pose.st="up";setMsg("Body tracking ready. Get your shoulders, arms and hands in view.")})
  .catch(function(e){pose.state="fail";setMsg("Body tracking could not load ("+((e&&e.message)||e)+"). Using basic mode.");calStart()})
}
function recal(){calStart();if(pose.state=="fail")pose.state="none";if(S.view==0&&cam)ensurePose()}
function drawSkel(L,msg){
  var c=document.getElementById("ov");if(!c)return;var x=c.getContext("2d");x.clearRect(0,0,320,240);
  if(L){
    var X=function(i){return(1-L[i].x)*320},Y=function(i){return L[i].y*240},ok=function(i){return L[i].visibility>.4};
    x.strokeStyle="#ff2a3c";x.fillStyle="#ff2a3c";x.lineWidth=4;x.lineCap="round";
    [[11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28]].forEach(function(p){if(ok(p[0])&&ok(p[1])){x.beginPath();x.moveTo(X(p[0]),Y(p[0]));x.lineTo(X(p[1]),Y(p[1]));x.stroke()}});
    [0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(function(i){if(ok(i)){x.beginPath();x.arc(X(i),Y(i),(i==15||i==16)?9:5,0,6.3);x.fill()}})
  }
  if(msg){x.fillStyle="#fff";x.strokeStyle="#000";x.lineWidth=3;x.font="bold 16px sans-serif";x.strokeText(msg,8,22);x.fillText(msg,8,22)}
  if(Date.now()-cs.flash<350){x.strokeStyle="#2fe07a";x.lineWidth=10;x.strokeRect(0,0,320,240)}
}
function poseFrame(){
  var v=document.getElementById("vid");if(!v||!cam||v.readyState<2)return;arSet();
  var ts=performance.now();if(ts<=pose.lastT)return;pose.lastT=ts;
  var res;try{res=pose.pl.detectForVideo(v,ts)}catch(e){return}
  var L=res&&res.landmarks&&res.landmarks[0],cc=document.getElementById("cc");if(cc)cc.textContent="Reps: "+S.reps;
  if(!L){pose.ang=null;setMsg("I can't see you. Get your upper body in view.");drawSkel(null);return}
  var w=v.videoWidth||320,h=v.videoHeight||240,P=function(i){return{x:L[i].x*w,y:L[i].y*h,v:L[i].visibility}},angs=[];
  [[11,13,15],[12,14,16]].forEach(function(t){var a=P(t[0]),b=P(t[1]),c=P(t[2]);if(a.v>.5&&b.v>.5&&c.v>.5)angs.push(ang(a,b,c))});
  if(!angs.length){pose.ang=null;setMsg("Show your shoulder, elbow and hand to the camera.");drawSkel(L);return}
  var A=angs.reduce(function(s,q){return s+q},0)/angs.length;pose.ang=pose.ang==null?A:pose.ang*.5+A*.5;
  var th=[130,105,85][S.diff],now=Date.now();
  var sg=document.getElementById("sig");if(sg)sg.style.width=Math.max(0,Math.min(100,(170-pose.ang)/(170-th)*100))+"%";
  if(pose.st=="up"&&pose.ang<th)pose.st="down";
  else if(pose.st=="down"&&pose.ang>150){pose.st="up";if(now-cs.lastRep>500){cs.lastRep=now;cs.flash=now;addRep();attachCam();setMsg("Rep counted!")}}
  if(now-cs.lastRep>1200)setMsg(pose.st=="down"?"Now push back up!":"Go down until your elbows bend below "+th+"°");
  drawSkel(L,"Elbow "+Math.round(pose.ang)+"°")
}
function camFrame(){
  if(S.view==0&&pose.state=="ready")poseFrame();
  else if(S.view==0&&pose.state=="loading")drawSkel(null);
  else basicFrame()
}
document.getElementById("mOk").onclick=function(){document.getElementById("modal").classList.remove("on")};
try{var ic=document.createElement("canvas");ic.width=ic.height=180;var ix=ic.getContext("2d"),gr=ix.createLinearGradient(0,0,180,180);gr.addColorStop(0,"#ff7a2f");gr.addColorStop(1,"#ff3d6e");ix.fillStyle=gr;ix.fillRect(0,0,180,180);ix.font="100px serif";ix.textAlign="center";ix.textBaseline="middle";ix.fillText("💪",90,98);var lk=document.createElement("link");lk.rel="apple-touch-icon";lk.href=ic.toDataURL("image/png");document.head.appendChild(lk)}catch(e){}
load();offline();render();
var lt=Date.now();
setInterval(function(){var n=Date.now(),dt=Math.min(2,(n-lt)/1000);lt=n;tick(dt);if(S.flash){pop(S.flash);S.flash=null;render()}else render(true)},250);
setInterval(save,5000);
document.addEventListener("visibilitychange",function(){if(document.hidden){save()}else{offline();lt=Date.now();render()}});
window.addEventListener("pagehide",save);
</script>
